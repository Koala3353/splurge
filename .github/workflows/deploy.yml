name: Deploy React to GitHub Pages

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      # `npm install`, not `npm ci`, and deliberately so.
      #
      # npm ci is the stricter gate and was tried first. It cannot pass here:
      # vite 8 pulls rolldown's wasm32-wasi fallback binding, whose optional
      # transitive deps (@emnapi/core, @emnapi/runtime) resolve to different
      # versions on linux than on the macOS where this lockfile is generated —
      # 1.11.3 vs 1.10.0 — so `npm ci` rejects a lockfile that is correct for
      # the machine that wrote it. Neither --os/--cpu regeneration nor
      # overrides fixes it from macOS, and the bindings in question are a wasm
      # fallback neither platform actually loads.
      #
      # The lockfile is still committed and still honoured. If you switch this
      # back to `npm ci`, regenerate the lockfile on linux first or the deploy
      # will fail on install.
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Test
        run: npm test
      - name: Lint
        run: npm run lint
      - name: Contrast check
        run: node scripts/check-contrast.mjs
      - name: Build
        run: npm run build
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
