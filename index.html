<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0A0A0C" />
    <meta name="description" content="Splurge — scan receipts, split bills, and track who owes you. A fast, offline-ready PWA." />

    <!-- iOS standalone web app -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Splurge" />

    <!-- No webfont. The stack resolves to San Francisco on iOS — which already
         ships the optical sizing and tracking tables a display face would be
         loaded for — and to Inter or the platform UI font elsewhere. That is
         two fewer network requests on a cold, offline-first launch. -->

    <title>Splurge — Split Bills</title>
    <style>
      html, body, #root {
        height: 100%;
        margin: 0;
        padding: 0;
      }
      /* Pre-hydration backdrop, so the launch flash matches whichever theme
         is about to render rather than always being dark. */
      html { background-color: #0A0A0C; }
      @media (prefers-color-scheme: light) {
        html:not([data-theme='dark']) { background-color: #F5F6F8; }
      }
      html[data-theme='light'] { background-color: #F5F6F8; }
    </style>
    <script>
      // Runs before first paint: a saved "force light"/"force dark" choice has
      // to be on the element BEFORE the stylesheet resolves, or the app paints
      // in the OS theme and then visibly snaps to the chosen one.
      (function () {
        try {
          var t = localStorage.getItem('splurge.theme');
          if (t === 'light' || t === 'dark') {
            document.documentElement.setAttribute('data-theme', t);
          }
          var dark = t === 'dark' || (t !== 'light' &&
            window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.querySelector('meta[name="theme-color"]')
            .setAttribute('content', dark ? '#0A0A0C' : '#F5F6F8');
        } catch (e) { /* private mode — fall through to the CSS default */ }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js').catch(() => {});
        });
      }
    </script>
  </body>
</html>
