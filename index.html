<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0A0A0C" />
    <meta name="description" content="Splurge — scan receipts, split bills, and track who owes you. A fast, offline-ready PWA." />

    <!-- iOS standalone web app -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Splurge" />

    <!-- Geist and Geist Mono, the same pair as koala3353.github.io/portfolio.
         The mono face is doing real work here, not decoration: every micro-
         label in the app is set in it, and that voice change is most of what
         makes the reference look the way it does. Loaded with display=swap so
         it never blocks render, and cached by the service worker after the
         first visit; the system fallbacks behind both are metrically close
         enough that nothing moves when it lands. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap"
    />

    <title>Splurge — Split Bills</title>
    <style>
      html, body, #root {
        height: 100%;
        margin: 0;
        padding: 0;
      }
      /* Pre-hydration backdrop, so the launch flash matches whichever theme
         is about to render rather than always being dark. */
      html { background-color: #0A0A0C; }
      @media (prefers-color-scheme: light) {
        html:not([data-theme='dark']) { background-color: #FAFAFB; }
      }
      html[data-theme='light'] { background-color: #FAFAFB; }
    </style>
    <script>
      // Runs before first paint: a saved "force light"/"force dark" choice has
      // to be on the element BEFORE the stylesheet resolves, or the app paints
      // in the OS theme and then visibly snaps to the chosen one.
      (function () {
        try {
          var t = localStorage.getItem('splurge.theme');
          if (t === 'light' || t === 'dark') {
            document.documentElement.setAttribute('data-theme', t);
          }
          var dark = t === 'dark' || (t !== 'light' &&
            window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.querySelector('meta[name="theme-color"]')
            .setAttribute('content', dark ? '#0A0A0C' : '#FAFAFB');
        } catch (e) { /* private mode — fall through to the CSS default */ }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js').catch(() => {});
        });
      }
    </script>
  </body>
</html>
